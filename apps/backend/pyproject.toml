[project]
name = "diploma-backend"
version = "0.1.0"
description = "diploma-maker backend: LLM routing, source management, formatting/export pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "qdrant-client>=1.18.0",
    "fastembed>=0.4",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.7",
    "mongomock-motor>=0.0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.security.HTTPBearer",
    "fastapi.File",
    "fastapi.Form",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diploma_backend"]
