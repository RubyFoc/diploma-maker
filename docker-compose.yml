services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - mongo
      - qdrant
      - redis

  worker:
    build:
      context: ./apps/backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /app/uploads
    command: ["uv", "run", "celery", "-A", "diploma_backend.worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - redis
      - mongo
      - qdrant

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
  qdrant-data:
  uploads-data:
